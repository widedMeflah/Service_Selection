tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case B-aws-postgresql-vm-private, derived from C3 request 11 (managed PostgreSQL database).
  Cloud services: vm_docker (virtual machine), postgresql_dbms (managed database). Software components hosted on
  them: app_container, docker_engine, db_app.'
node_types:
  RuntimeForContainer:
    derived_from: tosca.nodes.Container.Runtime
    capabilities:
      host:
        type: tosca.capabilities.Compute
  ContainerWithDatabase:
    derived_from: tosca.nodes.Container.Application
    requirements:
    - database_connection:
        capability: tosca.capabilities.Endpoint.Database
        node: Database
        occurrences:
        - 1
        - UNBOUNDED
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    app_container:
      type: ContainerWithDatabase
      requirements:
      - host: docker_engine
      - database_connection: db_app
    docker_engine:
      type: RuntimeForContainer
      capabilities:
        host: {}
      requirements:
      - host: vm_docker
    vm_docker:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_docker
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
      requirements:
      - dependency: vpc_aws_us_east_1
      - dependency: subnet_aws_us_east_1
      - dependency: security_group_aws_us_east_1
    db_app:
      type: Database
      properties:
        name: app_db
        port: 5432
        user: db_user
        password: db_password
      requirements:
      - host: postgresql_dbms
    postgresql_dbms:
      type: DBMS
      properties:
        root_password: root_password
        port: 5432
      capabilities:
        host:
          properties:
            name: postgresql_dbms
            num_cpus: 2
            mem_size: 4 GB
      requirements:
      - dependency: vpc_aws_us_east_1
      - dependency: subnet_aws_us_east_1
      - dependency: db_subnet_group_aws_us_east_1
      - dependency: vpc_security_group_aws_us_east_1
    vpc_aws_us_east_1:
      type: tosca.nodes.network.Network
      metadata:
        dependent_resource: true
        provider: aws
        region: us-east-1
        source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-networking.html
        quote: Amazon VPC enables you to launch AWS resources, such as Amazon EC2 instances, into a virtual network
          dedicated to your AWS account, known as a virtual private cloud (VPC).
        policy_properties:
          region: us-west-2
        settings: {}
        required_by:
        - vm_docker
        - postgresql_dbms
    subnet_aws_us_east_1:
      type: tosca.nodes.network.Network
      metadata:
        dependent_resource: true
        provider: aws
        region: us-east-1
        source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-networking.html
        quote: When you launch an instance, you can select a subnet from the VPC.
        settings: {}
        required_by:
        - vm_docker
        - postgresql_dbms
      requirements:
      - dependency: vpc_aws_us_east_1
    security_group_aws_us_east_1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: aws
        region: us-east-1
        source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
        quote: If you don't specify a security group, Amazon EC2 uses the default security group for the VPC.
        settings: {}
        required_by:
        - vm_docker
      requirements:
      - dependency: vpc_aws_us_east_1
    db_subnet_group_aws_us_east_1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: aws
        region: us-east-1
        source: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html
        quote: Your VPC must have a DB subnet group that you create.
        settings: {}
        required_by:
        - postgresql_dbms
      requirements:
      - dependency: vpc_aws_us_east_1
    vpc_security_group_aws_us_east_1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: aws
        region: us-east-1
        source: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html
        quote: Your VPC must have a VPC security group that allows access to the DB instance.
        settings:
          internet_exposure:
          - false
        required_by:
        - postgresql_dbms
      requirements:
      - dependency: vpc_aws_us_east_1
  policies:
  - placement_all:
      type: acme.policies.Placement
      properties:
        locations:
        - region: us-east-1
      targets:
      - vm_docker
      - postgresql_dbms
  - private_database:
      type: acme.policies.Exposure
      properties:
        public: false
      targets:
      - postgresql_dbms
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Deployment locations of the targets (regions or logical locations).
    properties:
      locations:
        type: list
        required: true
  acme.policies.Exposure:
    derived_from: tosca.policies.Root
    description: Whether the targets may be reachable from the Internet.
    properties:
      public:
        type: boolean
        required: true
