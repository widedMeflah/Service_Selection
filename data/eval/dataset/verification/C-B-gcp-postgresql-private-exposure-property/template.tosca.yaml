tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case B-gcp-postgresql-private, derived from C3 request 58 (managed database). Cloud services:
  postgresql_dbms (managed database). Software components hosted on them: postgres_db.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Geographic placement constraint (region and/or availability zone).
    properties:
      locations:
        type: list
        required: true
        entry_schema:
          type: acme.datatypes.Location
      distribution:
        type: string
        default: multi_region
        constraints:
        - valid_values:
          - single_region
          - multi_region
  acme.policies.Availability:
    derived_from: tosca.policies.Performance
    description: Service-level availability target (percent).
    properties:
      availability:
        type: float
        required: true
        constraints:
        - in_range:
          - 0.0
          - 100.0
  acme.policies.Exposure:
    derived_from: tosca.policies.Root
    description: Whether the targets may be reachable from the Internet.
    properties:
      public:
        type: boolean
        required: true
topology_template:
  node_templates:
    postgresql_dbms:
      type: DBMS
      properties:
        root_password: root_password123
        port: 5432
      capabilities:
        host:
          properties:
            num_cpus: 2
            mem_size: 8 GB
      requirements:
      - dependency: vpc_network_gcp_us_central1
      - dependency: allocated_ip_address_range_gcp_us_central1
      - dependency: private_services_access_connection_gcp_us_central1
    postgres_db:
      type: Database
      properties:
        name: postgres_db
        port: 5432
        user: db_admin
        password: secure_password123
      requirements:
      - host: postgresql_dbms
    vpc_network_gcp_us_central1:
      type: tosca.nodes.network.Network
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/sql/docs/postgres/configure-private-services-access
        quote: Cloud SQL requires private services access for each VPC network that's used for private IP connections.
        policy_properties:
          internet_exposure: true
        settings: {}
        required_by:
        - postgresql_dbms
    allocated_ip_address_range_gcp_us_central1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/sql/docs/postgres/configure-private-services-access
        quote: Select an existing, or allocate a new IP address range.
        settings: {}
        required_by:
        - postgresql_dbms
      requirements:
      - dependency: vpc_network_gcp_us_central1
    private_services_access_connection_gcp_us_central1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/sql/docs/postgres/configure-private-services-access
        quote: Create the private services connection from your VPC network to the underlying service producer network.
        settings: {}
        required_by:
        - postgresql_dbms
      requirements:
      - dependency: vpc_network_gcp_us_central1
  policies:
  - availability_policy_1:
      type: acme.policies.Availability
      targets:
      - postgres_db
      properties:
        availability: 99.9
  - placement_all:
      type: acme.policies.Placement
      properties:
        locations:
        - region: us-central1
      targets:
      - postgresql_dbms
  - private_database:
      type: acme.policies.Exposure
      properties:
        public: false
      targets:
      - postgresql_dbms
