tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case B-gcp-postgresql-vm, derived from C3 request 11 (managed PostgreSQL database). Cloud
  services: vm_docker (virtual machine), postgresql_dbms (managed database). Software components hosted on them:
  app_container, docker_engine, db_app.'
node_types:
  RuntimeForContainer:
    derived_from: tosca.nodes.Container.Runtime
    capabilities:
      host:
        type: tosca.capabilities.Compute
  ContainerWithDatabase:
    derived_from: tosca.nodes.Container.Application
    requirements:
    - database_connection:
        capability: tosca.capabilities.Endpoint.Database
        node: Database
        occurrences:
        - 1
        - UNBOUNDED
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    app_container:
      type: ContainerWithDatabase
      requirements:
      - host: docker_engine
      - database_connection: db_app
    docker_engine:
      type: RuntimeForContainer
      capabilities:
        host: {}
      requirements:
      - host: vm_docker
    vm_docker:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_docker
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
      requirements:
      - dependency: vpc_network_gcp_us_central1
      - dependency: subnet_gcp_us_central1
    db_app:
      type: Database
      properties:
        name: app_db
        port: 5432
        user: db_user
        password: db_password
      requirements:
      - host: postgresql_dbms
    postgresql_dbms:
      type: DBMS
      properties:
        root_password: root_password
        port: 5432
      capabilities:
        host:
          properties:
            name: postgresql_dbms
            num_cpus: 2
            mem_size: 4 GB
      requirements:
      - dependency: vpc_network_gcp_us_central1
      - dependency: allocated_ip_address_range_gcp_us_central1
      - dependency: private_services_access_connection_gcp_us_central1
    vpc_network_gcp_us_central1:
      type: tosca.nodes.network.Network
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/compute/docs/networking/network-overview
        quote: Every VM is part of a VPC network.
        policy_properties:
          region: europe-west1
        settings: {}
        required_by:
        - vm_docker
        - postgresql_dbms
    subnet_gcp_us_central1:
      type: tosca.nodes.network.Network
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/compute/docs/networking/network-overview
        quote: If you omit this configuration, the default network and subnet are used.
        settings: {}
        required_by:
        - vm_docker
      requirements:
      - dependency: vpc_network_gcp_us_central1
    allocated_ip_address_range_gcp_us_central1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/sql/docs/postgres/configure-private-services-access
        quote: Select an existing, or allocate a new IP address range.
        settings: {}
        required_by:
        - postgresql_dbms
      requirements:
      - dependency: vpc_network_gcp_us_central1
    private_services_access_connection_gcp_us_central1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/sql/docs/postgres/configure-private-services-access
        quote: Create the private services connection from your VPC network to the underlying service producer network.
        settings: {}
        required_by:
        - postgresql_dbms
      requirements:
      - dependency: vpc_network_gcp_us_central1
  policies:
  - placement_all:
      type: acme.policies.Placement
      properties:
        locations:
        - region: us-central1
      targets:
      - vm_docker
      - postgresql_dbms
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Deployment locations of the targets (regions or logical locations).
    properties:
      locations:
        type: list
        required: true
