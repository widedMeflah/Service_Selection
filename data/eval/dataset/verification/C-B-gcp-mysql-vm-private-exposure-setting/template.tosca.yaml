tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case B-gcp-mysql-vm-private, derived from C3 request 10 (managed database). Cloud services:
  vm_db_app (virtual machine), mysql_dbms (managed database). Software components hosted on them: docker_application,
  docker_engine, bdd_mysql.'
node_types:
  RuntimeForContainer:
    derived_from: tosca.nodes.Container.Runtime
    capabilities:
      host:
        type: tosca.capabilities.Compute
  ContainerWithDatabase:
    derived_from: tosca.nodes.Container.Application
    requirements:
    - database_connection:
        capability: tosca.capabilities.Endpoint.Database
        node: Database
        occurrences:
        - 1
        - UNBOUNDED
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    docker_application:
      type: ContainerWithDatabase
      requirements:
      - host: docker_engine
      - database_connection: bdd_mysql
    docker_engine:
      type: RuntimeForContainer
      capabilities:
        host: {}
      requirements:
      - host: vm_db_app
    vm_db_app:
      type: Compute
      capabilities:
        host:
          properties:
            name: vm_db_app
            num_cpus: 8
            mem_size: 32 GB
            disk_size: 100 GB
        os:
          properties:
            architecture: x86_64
            type: linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
        endpoint:
          properties:
            protocol: tcp
      requirements:
      - dependency: vpc_network_gcp_us_central1
      - dependency: subnet_gcp_us_central1
    mysql_dbms:
      type: DBMS
      properties:
        root_password: kjih589Y
        port: 3306
      capabilities:
        host:
          properties:
            name: mysql_dbms
            num_cpus: 1
            mem_size: 2 GB
            disk_size: 50 GB
      requirements:
      - dependency: vpc_network_gcp_us_central1
      - dependency: allocated_ip_address_range_gcp_us_central1
      - dependency: private_services_access_connection_gcp_us_central1
    bdd_mysql:
      type: Database
      properties:
        name: bdd_mysql
        port: 3306
        user: admin_user
        password: dljgpzi87
      requirements:
      - host: mysql_dbms
    vpc_network_gcp_us_central1:
      type: tosca.nodes.network.Network
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/compute/docs/networking/network-overview
        quote: Every VM is part of a VPC network.
        settings:
          internet_exposure:
          - true
        required_by:
        - vm_db_app
        - mysql_dbms
    subnet_gcp_us_central1:
      type: tosca.nodes.network.Network
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/compute/docs/networking/network-overview
        quote: If you omit this configuration, the default network and subnet are used.
        settings: {}
        required_by:
        - vm_db_app
      requirements:
      - dependency: vpc_network_gcp_us_central1
    allocated_ip_address_range_gcp_us_central1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/sql/docs/mysql/configure-private-services-access
        quote: Select an existing, or allocate a new IP address range.
        settings: {}
        required_by:
        - mysql_dbms
      requirements:
      - dependency: vpc_network_gcp_us_central1
    private_services_access_connection_gcp_us_central1:
      type: tosca.nodes.Root
      metadata:
        dependent_resource: true
        provider: gcp
        region: us-central1
        source: https://docs.cloud.google.com/sql/docs/mysql/configure-private-services-access
        quote: Create the private services connection from your VPC network to the underlying service producer network.
        settings: {}
        required_by:
        - mysql_dbms
      requirements:
      - dependency: vpc_network_gcp_us_central1
  policies:
  - placement_all:
      type: acme.policies.Placement
      properties:
        locations:
        - region: us-central1
      targets:
      - vm_db_app
      - mysql_dbms
  - private_database:
      type: acme.policies.Exposure
      properties:
        public: false
      targets:
      - mysql_dbms
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Deployment locations of the targets (regions or logical locations).
    properties:
      locations:
        type: list
        required: true
  acme.policies.Exposure:
    derived_from: tosca.policies.Root
    description: Whether the targets may be reachable from the Internet.
    properties:
      public:
        type: boolean
        required: true
