tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case A-coloc_infeasible-12p-anywhere-twin, derived from C3 request 12 (managed PostgreSQL
  database). Cloud services: vm_container (virtual machine), postgresql_dbms (managed database). Software components
  hosted on them: docker_engine, app_container, secure_data.'
node_types:
  RuntimeForContainer:
    derived_from: tosca.nodes.Container.Runtime
    capabilities:
      host:
        type: tosca.capabilities.Compute
  ContainerWithDatabase:
    derived_from: tosca.nodes.Container.Application
    requirements:
    - database_connection:
        capability: tosca.capabilities.Endpoint.Database
        node: Database
        occurrences:
        - 1
        - UNBOUNDED
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    vm_container:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_container
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
    docker_engine:
      type: RuntimeForContainer
      capabilities:
        host: {}
      requirements:
      - host: vm_container
    app_container:
      type: ContainerWithDatabase
      requirements:
      - host: docker_engine
      - database_connection: secure_data
    secure_data:
      type: Database
      properties:
        name: secure_data
        port: 5432
        user: db_user
        password: db_password
      requirements:
      - host: postgresql_dbms
    postgresql_dbms:
      type: DBMS
      properties:
        port: 5432
      capabilities:
        host:
          properties:
            name: postgresql_dbms
            num_cpus: 2
            mem_size: 4 GB
  policies:
  - placement_vm:
      type: acme.policies.Placement
      properties:
        locations:
        - region: europe
      targets:
      - vm_container
  - placement_db:
      type: acme.policies.Placement
      properties:
        locations:
        - region: usa
      targets:
      - postgresql_dbms
  - same_region:
      type: acme.policies.Colocation
      properties:
        scope: region
      targets:
      - vm_container
      - postgresql_dbms
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Deployment locations of the targets (regions or logical locations).
    properties:
      locations:
        type: list
        required: true
  acme.policies.Colocation:
    derived_from: tosca.policies.Placement
    description: The targets share a region (logical location) or a provider.
    properties:
      scope:
        type: string
        required: true
        constraints:
        - valid_values:
          - region
          - provider
