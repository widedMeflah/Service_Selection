tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-02, derived from C3 request 02. Cloud services: vm_app (virtual machine), vm_search
  (virtual machine). Software components hosted on them: alien_web_app, tomcat_web_server, elasticsearch_software.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    alien_web_app:
      type: WebApplication
      properties:
        context_root: /alien
      capabilities:
        app_endpoint:
          properties:
            protocol: http
            port: 8080
            secure: false
      requirements:
      - host: tomcat_web_server
      - dependency: elasticsearch_software
    tomcat_web_server:
      type: WebServer
      requirements:
      - host: vm_app
    vm_app:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_app
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: ssh
            port: 22
            secure: true
            initiator: source
    elasticsearch_software:
      type: SoftwareComponent
      properties:
        component_version: 8.12.0
      requirements:
      - host: vm_search
    vm_search:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_search
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: ssh
            port: 22
            secure: true
            initiator: source
