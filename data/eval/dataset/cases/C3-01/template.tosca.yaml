tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-01, derived from C3 request 01. Cloud services: vm_alien (virtual machine), vm_elasticsearch
  (virtual machine). Software components hosted on them: alien_application, tomcat_server, elasticsearch.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    vm_alien:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_alien
            num_cpus: 3
            disk_size: 20 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
    alien_application:
      type: WebApplication
      properties:
        context_root: /alien
      capabilities:
        app_endpoint:
          properties:
            protocol: http
            secure: false
      requirements:
      - host: tomcat_server
      - dependency: elasticsearch
    tomcat_server:
      type: WebServer
      requirements:
      - host: vm_alien
    vm_elasticsearch:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_elasticsearch
            num_cpus: 3
            disk_size: 10 GB
            mem_size: 2 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
    elasticsearch:
      type: SoftwareComponent
      properties:
        component_version: 8.12.0
      requirements:
      - host: vm_elasticsearch
