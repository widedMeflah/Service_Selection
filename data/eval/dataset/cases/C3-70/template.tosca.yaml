tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-70, derived from C3 request 70. Cloud services: vm_db (virtual machine), vm_app
  (virtual machine). Software components hosted on them: MySQL_DBMS.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Geographic placement constraint (region and/or availability zone).
    properties:
      locations:
        type: list
        required: true
        entry_schema:
          type: acme.datatypes.Location
      distribution:
        type: string
        default: multi_region
        constraints:
        - valid_values:
          - single_region
          - multi_region
  acme.policies.Cost:
    derived_from: tosca.policies.Root
    description: Budget constraint over a billing period.
    properties:
      max_cost:
        type: float
        required: true
      currency:
        type: string
        default: USD
        constraints:
        - valid_values:
          - USD
          - EUR
          - GBP
      period:
        type: string
        default: monthly
        constraints:
        - valid_values:
          - hourly
          - daily
          - monthly
          - yearly
topology_template:
  node_templates:
    vm_db:
      type: Compute
      capabilities:
        host:
          properties:
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
    MySQL_DBMS:
      type: DBMS
      properties:
        root_password: secure_root_password
        port: 3306
      capabilities:
        host: {}
      requirements:
      - host: vm_db
    vm_app:
      type: Compute
      capabilities:
        host:
          properties:
            num_cpus: 4
            disk_size: 100 GB
            mem_size: 16 GB
        os:
          properties:
            type: Linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
  policies:
  - placement_group_1:
      type: acme.policies.Placement
      targets:
      - vm_app
      - vm_db
      properties:
        locations:
        - region: eu-west-2
  - cost_policy_1:
      type: acme.policies.Cost
      targets:
      - vm_app
      properties:
        max_cost: 146.0
  - cost_policy_2:
      type: acme.policies.Cost
      targets:
      - vm_db
      properties:
        max_cost: 73.0
