tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-03, derived from C3 request 03. Cloud services: vm_app (virtual machine), vm_search
  (virtual machine). Software components hosted on them: JavaApp, Tomcat, Elasticsearch.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    JavaApp:
      type: WebApplication
      properties:
        context_root: /javaapp
      capabilities:
        app_endpoint:
          properties:
            protocol: http
            port: 8080
            secure: false
      requirements:
      - host: Tomcat
      - dependency: Elasticsearch
    Tomcat:
      type: WebServer
      requirements:
      - host: vm_app
    vm_app:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_app
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: http
            secure: false
    Elasticsearch:
      type: SoftwareComponent
      properties:
        component_version: 8.12.0
      requirements:
      - host: vm_search
    vm_search:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_search
            num_cpus: 4
            disk_size: 100 GB
            mem_size: 16 GB
        os:
          properties:
            architecture: x86_64
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: http
            secure: false
