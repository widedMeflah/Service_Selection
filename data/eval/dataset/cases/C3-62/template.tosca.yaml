tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-62, derived from C3 request 62. Cloud services: vm_storage (virtual machine).'
topology_template:
  node_templates:
    vm_storage:
      type: tosca.nodes.Compute
  policies:
  - placement_group_1:
      type: acme.policies.Placement
      targets:
      - vm_storage
      properties:
        locations:
        - region: eu-west-2
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Deployment locations of the targets (regions or logical locations).
    properties:
      locations:
        type: list
        required: true
