tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case A-coloc_infeasible-07m-anywhere, derived from C3 request 07 (managed database). Cloud
  services: vm_app (virtual machine), PostgreSQL_DBMS (managed database). Software components hosted on them: Nodecellar_web_app,
  Nodejs_web_server, PostgreSQL_BDD, Nodejs_software_component.'
node_types:
  WebAppWithDatabase:
    derived_from: WebApplication
    requirements:
    - database_connection:
        capability: tosca.capabilities.Endpoint.Database
        node: Database
        occurrences:
        - 1
        - UNBOUNDED
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    Nodecellar_web_app:
      type: WebAppWithDatabase
      properties:
        context_root: /nodecellar
      capabilities:
        app_endpoint:
          properties:
            protocol: tcp
            port: 3000
            secure: false
      requirements:
      - host: Nodejs_web_server
      - database_connection: PostgreSQL_BDD
    Nodejs_web_server:
      type: WebServer
      requirements:
      - host: vm_app
    vm_app:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_app
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: Linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: tcp
            secure: false
    PostgreSQL_BDD:
      type: Database
      properties:
        name: nodecellar
        port: 5432
        user: nodecellar_user
        password: secure_password
      requirements:
      - host: PostgreSQL_DBMS
    PostgreSQL_DBMS:
      type: DBMS
      properties:
        port: 5432
      capabilities:
        host:
          properties:
            name: PostgreSQL_DBMS
            num_cpus: 4
            disk_size: 100 GB
            mem_size: 8 GB
    Nodejs_software_component:
      type: SoftwareComponent
      properties:
        component_version: 20.9.0
      requirements:
      - host: vm_app
  policies:
  - placement_vm:
      type: acme.policies.Placement
      properties:
        locations:
        - region: europe
      targets:
      - vm_app
  - placement_db:
      type: acme.policies.Placement
      properties:
        locations:
        - region: usa
      targets:
      - PostgreSQL_DBMS
  - same_region:
      type: acme.policies.Colocation
      properties:
        scope: region
      targets:
      - vm_app
      - PostgreSQL_DBMS
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Deployment locations of the targets (regions or logical locations).
    properties:
      locations:
        type: list
        required: true
  acme.policies.Colocation:
    derived_from: tosca.policies.Placement
    description: The targets share a region (logical location) or a provider.
    properties:
      scope:
        type: string
        required: true
        constraints:
        - valid_values:
          - region
          - provider
