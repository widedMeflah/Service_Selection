tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-55, derived from C3 request 55. Cloud services: vm_web (virtual machine), VM-A
  (virtual machine), VM-B (virtual machine). Software components hosted on them: app_frontend, Nginx_web_server,
  Nginx.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Geographic placement constraint (region and/or availability zone).
    properties:
      locations:
        type: list
        required: true
        entry_schema:
          type: acme.datatypes.Location
      distribution:
        type: string
        default: multi_region
        constraints:
        - valid_values:
          - single_region
          - multi_region
topology_template:
  node_templates:
    app_frontend:
      type: WebApplication
      capabilities:
        app_endpoint:
          properties:
            protocol: http
            secure: false
      requirements:
      - host: Nginx_web_server
    Nginx_web_server:
      type: WebServer
      requirements:
      - host: vm_web
    vm_web:
      type: Compute
      capabilities:
        host:
          properties:
            name: vm_web
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 2
            max_instances: 10
            default_instances: 2
        endpoint:
          properties:
            protocol: tcp
            secure: false
    Nginx:
      type: SoftwareComponent
      properties:
        component_version: 1.25.0
      requirements:
      - host: vm_web
    VM-A:
      type: Compute
      capabilities:
        host:
          properties:
            name: VM-A
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: tcp
            secure: false
    VM-B:
      type: Compute
      capabilities:
        host:
          properties:
            name: VM-B
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: tcp
            secure: false
  policies:
  - placement_group_1:
      type: acme.policies.Placement
      targets:
      - vm_web
      - VM-A
      properties:
        locations:
        - region: us-east-1
  - placement_VM-B:
      type: acme.policies.Placement
      targets:
      - VM-B
      properties:
        locations:
        - region: eu-west-2
