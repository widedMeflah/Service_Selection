tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-46, derived from C3 request 46. Cloud services: VM_A (virtual machine), VM_B (virtual
  machine).'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Geographic placement constraint (region and/or availability zone).
    properties:
      locations:
        type: list
        required: true
        entry_schema:
          type: acme.datatypes.Location
      distribution:
        type: string
        default: multi_region
        constraints:
        - valid_values:
          - single_region
          - multi_region
topology_template:
  node_templates:
    VM_A:
      type: Compute
      capabilities:
        host:
          properties:
            num_cpus: 4
            disk_size: 50 GB
            mem_size: 8 GB
        os:
          properties:
            type: linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint: {}
    VM_B:
      type: Compute
      capabilities:
        host:
          properties:
            num_cpus: 4
            disk_size: 50 GB
            mem_size: 8 GB
        os:
          properties:
            type: linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint: {}
  policies:
  - placement_VM-A:
      type: acme.policies.Placement
      targets:
      - VM_A
      properties:
        locations:
        - region: us-east-1
        - region: eu-west-2
  - placement_VM-B:
      type: acme.policies.Placement
      targets:
      - VM_B
      properties:
        locations:
        - region: eu-west-2
