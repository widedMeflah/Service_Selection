tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case A-infeasible_budget-25v-usa, derived from C3 request 25 (as interpreted). Cloud services:
  VM_A (virtual machine), VM_B (virtual machine).'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Geographic placement constraint (region and/or availability zone).
    properties:
      locations:
        type: list
        required: true
        entry_schema:
          type: acme.datatypes.Location
      distribution:
        type: string
        default: multi_region
        constraints:
        - valid_values:
          - single_region
          - multi_region
  acme.policies.Cost:
    derived_from: tosca.policies.Root
    description: Monthly budget of the targets (sum of their prices).
    properties:
      max_cost:
        type: float
        required: true
      currency:
        type: string
        default: USD
topology_template:
  node_templates:
    VM_A:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: VM_A
            num_cpus: 4
            disk_size: 50 GB
            mem_size: 8 GB
        os:
          properties:
            type: Linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
    VM_B:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: VM_B
            num_cpus: 4
            disk_size: 50 GB
            mem_size: 8 GB
        os:
          properties:
            type: Linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
  policies:
  - placement_all:
      type: acme.policies.Placement
      properties:
        locations:
        - region: usa
      targets:
      - VM_A
      - VM_B
  - budget:
      type: acme.policies.Cost
      properties:
        max_cost: 176.08
        currency: USD
      targets:
      - VM_A
      - VM_B
