tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case A-infeasible_both-26v-europe, derived from C3 request 26 (as interpreted). Cloud services:
  vm_us_central1 (virtual machine), vm_europe_west2 (virtual machine). Software components hosted on them: overlay_network.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Geographic placement constraint (region and/or availability zone).
    properties:
      locations:
        type: list
        required: true
        entry_schema:
          type: acme.datatypes.Location
      distribution:
        type: string
        default: multi_region
        constraints:
        - valid_values:
          - single_region
          - multi_region
  acme.policies.Cost:
    derived_from: tosca.policies.Root
    description: Monthly budget of the targets (sum of their prices).
    properties:
      max_cost:
        type: float
        required: true
      currency:
        type: string
        default: USD
  acme.policies.Availability:
    derived_from: tosca.policies.Performance
    description: End-to-end availability of the targets (product, percent).
    properties:
      availability:
        type: float
        required: true
topology_template:
  node_templates:
    vm_us_central1:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_us_central1
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
    vm_europe_west2:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_europe_west2
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            secure: false
    overlay_network:
      type: SoftwareComponent
      properties:
        component_version: 1.0.0
      requirements:
      - host: vm_us_central1
      - host: vm_europe_west2
  policies:
  - placement_all:
      type: acme.policies.Placement
      properties:
        locations:
        - region: europe
      targets:
      - vm_us_central1
      - vm_europe_west2
  - budget:
      type: acme.policies.Cost
      properties:
        max_cost: 96.84
        currency: USD
      targets:
      - vm_us_central1
      - vm_europe_west2
  - end_to_end_availability:
      type: acme.policies.Availability
      properties:
        availability: 99.8501
      targets:
      - vm_us_central1
      - vm_europe_west2
