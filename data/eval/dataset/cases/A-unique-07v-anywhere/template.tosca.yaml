tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case A-unique-07v-anywhere, derived from C3 request 07 (as interpreted). Cloud services:
  vm_app (virtual machine), vm_db (virtual machine). Software components hosted on them: Nodecellar_web_app, Nodejs_web_server,
  PostgreSQL_BDD, PostgreSQL_DBMS, Nodejs_software_component.'
node_types:
  WebAppWithDatabase:
    derived_from: WebApplication
    requirements:
    - database_connection:
        capability: tosca.capabilities.Endpoint.Database
        node: Database
        occurrences:
        - 1
        - UNBOUNDED
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    Nodecellar_web_app:
      type: WebAppWithDatabase
      properties:
        context_root: /nodecellar
      capabilities:
        app_endpoint:
          properties:
            protocol: tcp
            port: 3000
            secure: false
      requirements:
      - host: Nodejs_web_server
      - database_connection: PostgreSQL_BDD
    Nodejs_web_server:
      type: WebServer
      requirements:
      - host: vm_app
    vm_app:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_app
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: Linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: tcp
            secure: false
    PostgreSQL_BDD:
      type: Database
      properties:
        name: nodecellar
        port: 5432
        user: nodecellar_user
        password: secure_password
      requirements:
      - host: PostgreSQL_DBMS
    PostgreSQL_DBMS:
      type: DBMS
      properties:
        port: 5432
      capabilities:
        host:
          properties:
            name: PostgreSQL_DBMS
            num_cpus: 4
            disk_size: 100 GB
            mem_size: 8 GB
      requirements:
      - host: vm_db
    vm_db:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_db
            num_cpus: 4
            disk_size: 100 GB
            mem_size: 8 GB
        os:
          properties:
            architecture: x86_64
            type: Linux
            distribution: Ubuntu
            version: 22.04.0
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: tcp
            secure: false
    Nodejs_software_component:
      type: SoftwareComponent
      properties:
        component_version: 20.9.0
      requirements:
      - host: vm_app
  policies:
  - budget:
      type: acme.policies.Cost
      properties:
        max_cost: 154.07
        currency: USD
      targets:
      - vm_app
      - vm_db
  - end_to_end_availability:
      type: acme.policies.Availability
      properties:
        availability: 99.8001
      targets:
      - vm_app
      - vm_db
policy_types:
  acme.policies.Cost:
    derived_from: tosca.policies.Root
    description: Monthly budget of the targets (sum of their prices).
    properties:
      max_cost:
        type: float
        required: true
      currency:
        type: string
        default: USD
  acme.policies.Availability:
    derived_from: tosca.policies.Performance
    description: End-to-end availability of the targets (product, percent).
    properties:
      availability:
        type: float
        required: true
