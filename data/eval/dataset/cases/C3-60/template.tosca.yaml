tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case C3-60, derived from C3 request 60. Cloud services: vm_mysql_primary (virtual machine),
  vm_mysql_standby (virtual machine). Software components hosted on them: mysql_dbms, mysql_db.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
policy_types:
  acme.policies.Placement:
    derived_from: tosca.policies.Placement
    description: Geographic placement constraint (region and/or availability zone).
    properties:
      locations:
        type: list
        required: true
        entry_schema:
          type: acme.datatypes.Location
      distribution:
        type: string
        default: multi_region
        constraints:
        - valid_values:
          - single_region
          - multi_region
  acme.policies.Availability:
    derived_from: tosca.policies.Performance
    description: Service-level availability target (percent).
    properties:
      availability:
        type: float
        required: true
        constraints:
        - in_range:
          - 0.0
          - 100.0
  acme.policies.Redundancy:
    derived_from: tosca.policies.Root
    description: 'The targets are replicas of one another (e.g. a primary and its standby): the group is available
      when one of them is.'
topology_template:
  node_templates:
    vm_mysql_primary:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_mysql_primary
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            port: 3306
            secure: false
    vm_mysql_standby:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_mysql_standby
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            type: Linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        binding: {}
        endpoint:
          properties:
            protocol: tcp
            port: 3306
            secure: false
    mysql_dbms:
      type: DBMS
      properties:
        port: 3306
      capabilities:
        host:
          properties:
            name: mysql_dbms
      requirements:
      - host: vm_mysql_primary
      - host: vm_mysql_standby
    mysql_db:
      type: Database
      properties:
        name: mysql_db
        port: 3306
        user: db_user
        password: db_password
      requirements:
      - host: mysql_dbms
  policies:
  - placement_vm_mysql_primary:
      type: acme.policies.Placement
      targets:
      - vm_mysql_primary
      properties:
        locations:
        - region: eu-west-2
  - placement_vm_mysql_standby:
      type: acme.policies.Placement
      targets:
      - vm_mysql_standby
      properties:
        locations:
        - region: eu-west-2
  - availability_policy_1:
      type: acme.policies.Availability
      targets:
      - vm_mysql_primary
      - vm_mysql_standby
      - mysql_db
      - mysql_dbms
      properties:
        availability: 99.5
  - replication:
      type: acme.policies.Redundancy
      targets:
      - vm_mysql_primary
      - vm_mysql_standby
