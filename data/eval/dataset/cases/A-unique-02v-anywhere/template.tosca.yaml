tosca_definitions_version: tosca_simple_yaml_1_3
description: 'Evaluation case A-unique-02v-anywhere, derived from C3 request 02 (as interpreted). Cloud services:
  vm_app (virtual machine), vm_search (virtual machine). Software components hosted on them: alien_web_app, tomcat_web_server,
  elasticsearch_software.'
data_types:
  acme.datatypes.Location:
    derived_from: tosca.datatypes.Root
    description: 'A deployment location: region and/or availability zone.'
    properties:
      region:
        type: string
        required: false
      availability_zone:
        type: string
        required: false
topology_template:
  node_templates:
    alien_web_app:
      type: WebApplication
      properties:
        context_root: /alien
      capabilities:
        app_endpoint:
          properties:
            protocol: http
            port: 8080
            secure: false
      requirements:
      - host: tomcat_web_server
      - dependency: elasticsearch_software
    tomcat_web_server:
      type: WebServer
      requirements:
      - host: vm_app
    vm_app:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_app
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: ssh
            port: 22
            secure: true
            initiator: source
    elasticsearch_software:
      type: SoftwareComponent
      properties:
        component_version: 8.12.0
      requirements:
      - host: vm_search
    vm_search:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            name: vm_search
            num_cpus: 2
            disk_size: 50 GB
            mem_size: 4 GB
        os:
          properties:
            architecture: x86_64
            type: linux
        scalable:
          properties:
            min_instances: 1
            max_instances: 1
            default_instances: 1
        endpoint:
          properties:
            protocol: ssh
            port: 22
            secure: true
            initiator: source
  policies:
  - budget:
      type: acme.policies.Cost
      properties:
        max_cost: 102.71
        currency: USD
      targets:
      - vm_app
      - vm_search
  - end_to_end_availability:
      type: acme.policies.Availability
      properties:
        availability: 99.8001
      targets:
      - vm_app
      - vm_search
policy_types:
  acme.policies.Cost:
    derived_from: tosca.policies.Root
    description: Monthly budget of the targets (sum of their prices).
    properties:
      max_cost:
        type: float
        required: true
      currency:
        type: string
        default: USD
  acme.policies.Availability:
    derived_from: tosca.policies.Performance
    description: End-to-end availability of the targets (product, percent).
    properties:
      availability:
        type: float
        required: true
